<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platinum Path — a story-first reader for the GTA VI platinum</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="column">
  <section id="hero" aria-label="Resume your story"></section>
  <nav id="rail" aria-label="Chapter progress"></nav>
  <section class="toolbar" aria-label="Reading controls">
    <div class="kinds" role="group" aria-label="Filter the off-script list by kind">
      <button type="button" data-kind="all" class="kind is-active">All</button>
      <button type="button" data-kind="story" class="kind">Story</button>
      <button type="button" data-kind="missable" class="kind">Missable</button>
      <button type="button" data-kind="collectibles" class="kind">Collectibles</button>
      <button type="button" data-kind="activities" class="kind">Activities</button>
    </div>
    <label class="spoiler-toggle">
      <input type="checkbox" id="spoilers" checked>
      Spoiler fog on
    </label>
  </section>
  <section id="reader" aria-label="The story, beat by beat"></section>
  <section id="offscript" aria-label="Off the script"></section>
  <footer class="account">
    <h2>Your place in the story</h2>
    <p>Progress lives only in this browser. Take it with you, or leave it behind.</p>
    <div class="account-actions">
      <button type="button" id="export">Export progress</button>
      <label class="import-button">Import progress
        <input type="file" id="import" accept="application/json" hidden>
      </label>
      <button type="button" id="wipe" class="danger">Start fresh — wipe my place</button>
    </div>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
